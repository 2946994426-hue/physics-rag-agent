[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "physics-rag-agent"
version = "0.1.0"
description = "基于 RAG 的物理学史智能知识库 Agent 系统"
requires-python = ">=3.11"
dependencies = [
    # LangChain 生态
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-text-splitters>=0.3.0",

    # 向量库
    "faiss-cpu>=1.8.0",

    # Embedding
    "sentence-transformers>=3.0",

    # Web UI
    "streamlit>=1.30",

    # 文档处理
    "pypdf>=5.0",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",

    # 配置 & 工具
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/physics_rag"]
